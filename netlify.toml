# Brandwide Analytics Dashboard — Netlify configuration

[build]
  publish   = "public"
  functions = "netlify/functions"
  # Compiles any AWR exports in data/rankings/ into public/data/rankings.json.
  command   = "node scripts/build-rankings.mjs"

[functions]
  node_bundler = "esbuild"
  # The Mouseflow snapshot is read from disk at request time rather than
  # bundled, so a new sync commit reaches the function on the next rebuild.
  included_files = ["data/mouseflow/**"]

# Friendly API paths -> serverless functions
[[redirects]]
  from = "/api/ga4"
  to   = "/.netlify/functions/ga4"
  status = 200

[[redirects]]
  from = "/api/gsc"
  to   = "/.netlify/functions/gsc"
  status = 200

[[redirects]]
  from = "/api/mouseflow"
  to   = "/.netlify/functions/mouseflow"
  status = 200

[[redirects]]
  from = "/api/mouseflow-ingest"
  to   = "/.netlify/functions/mouseflow-ingest"
  status = 200

[[redirects]]
  from = "/api/page-audit"
  to   = "/.netlify/functions/page-audit"
  status = 200

[[redirects]]
  from = "/api/health"
  to   = "/.netlify/functions/health"
  status = 200

# The sync tool is a real page, not part of the dashboard SPA.
[[redirects]]
  from = "/tools"
  to   = "/tools/index.html"
  status = 200

# SPA-style fallback for the single-page dashboard
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
